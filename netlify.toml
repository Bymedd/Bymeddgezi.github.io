# gezilecek.net — yönetim paneli fonksiyonları
# /haber/admin/ panelinin çağırdığı /api/admin/* uçları burada yayınlanır.
# Statik site davranışı değişmez: yayın kökü depo köküdür.

[build]
  publish = "."
  functions = "netlify/functions"
  environment = { NODE_VERSION = "22" }

[[headers]]
  for = "/api/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/haber/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Cache-Control = "no-store"
