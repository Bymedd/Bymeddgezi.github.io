[build]
  command = "node scripts/build-static.mjs"
  publish = "dist"

[[redirects]]
  from = "/"
  to = "/turkey.html"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
  X-Content-Type-Options = "nosniff"
  Referrer-Policy = "strict-origin-when-cross-origin"
